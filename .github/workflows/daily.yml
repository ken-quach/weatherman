name: daily-pipeline

on:
  schedule:
    - cron: "0 11 * * *"     # daily, 11:00 UTC (GitHub may delay a few minutes)
  workflow_dispatch: {}       # manual "Run workflow" button

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      DESTINATION__BIGQUERY__LOCATION: US
      DBT_PROFILES_DIR: dbt_project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}   # exports GOOGLE_APPLICATION_CREDENTIALS

      - name: Load raw data (dlt)
        run: python pipeline/load.py

      - name: Transform and test (dbt)
        run: dbt build --project-dir dbt_project
